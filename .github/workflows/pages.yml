name: Deploy leaderboard to GitHub Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Terminal-Bench 2.1 source
        uses: actions/checkout@v4
        with:
          repository: harbor-framework/terminal-bench-2-1
          path: _sources/terminal-bench-2-1
      - name: Verify data and frontend
        run: |
          python3 scripts/verify_site.py --source _sources/terminal-bench-2-1 --check-remote-sources
          node --check site/script.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
