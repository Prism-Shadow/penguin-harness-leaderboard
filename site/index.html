<!doctype html>
<html lang="en" data-theme="dark" data-theme-mode="system" data-locale="en" data-locale-pref="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Penguin Harness Leaderboard — Penguin experiments and sourced Terminal-Bench 2.1 reference results."
    />
    <meta property="og:title" content="Penguin Harness Leaderboard" />
    <meta
      property="og:description"
      content="Compare Terminal-Bench official baselines, vendor-reported results, and Penguin runs."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leaderboard.penguin.ooo/" />
    <link rel="canonical" href="https://leaderboard.penguin.ooo/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260902" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20260902" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260902" />
    <title>Penguin Harness Leaderboard</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("penguin-leaderboard.theme");
        const themeMode = ["light", "dark", "system"].includes(savedTheme) ? savedTheme : "system";
        const theme = themeMode === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : themeMode;
        document.documentElement.dataset.themeMode = themeMode;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#000000" : "#ffffff";

        const savedLocale = localStorage.getItem("penguin-leaderboard.locale");
        const localePref = ["en", "zh", "system"].includes(savedLocale) ? savedLocale : "system";
        const locale = localePref === "system"
          ? (navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en")
          : localePref;
        document.documentElement.dataset.localePref = localePref;
        document.documentElement.dataset.locale = locale;
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
      } catch {}
    </script>
    <link rel="stylesheet" href="styles.css?v=20261020-compact-header" />
    <script src="script.js?v=20261020-compact-header" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#results" data-i18n="skipToResults">Skip to results</a>

    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="#top" data-i18n-aria="home" aria-label="Penguin Harness Leaderboard home">
          <img src="favicon.svg" alt="" />
          <span>Penguin Harness Leaderboard</span>
        </a>

        <nav class="nav-actions" data-i18n-aria="siteControls" aria-label="Site controls">
          <div class="locale-control">
            <svg class="nav-icon locale-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"></path>
            </svg>
            <label class="sr-only" for="locale-select" data-i18n="language">Language</label>
            <select id="locale-select" class="locale-select">
              <option value="en">English</option>
              <option value="zh">中文</option>
              <option value="system">Follow system</option>
            </select>
          </div>
          <button class="theme-toggle" type="button" title="Theme" aria-label="Theme">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
          <a
            class="github-link"
            href="https://github.com/Prism-Shadow/penguin-harness-leaderboard"
            aria-label="GitHub"
          >
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.78 1.05.78 2.12 0 1.53-.02 2.76-.02 3.14 0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path>
            </svg>
          </a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section id="results" class="section section-anchor">
        <div class="section-shell results-content">
          <header class="section-heading results-heading">
            <h1 class="results-title">Terminal-Bench 2.1</h1>
          </header>

          <div class="leaderboard-card">
            <div class="result-toolbar">
              <div class="filter-menu-wrap">
                <button class="filter-toggle" type="button" aria-haspopup="menu" aria-controls="filter-menu" aria-expanded="false" data-i18n-aria="filters" aria-label="Filters">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h16v3l-6 7v5l-4 2v-7L4 7Z"/></svg>
                  <span class="filter-count" hidden></span>
                </button>
                <div id="filter-menu" class="filter-menu" hidden>
                  <div class="filter-categories" role="menu" data-i18n-aria="filters" aria-label="Filters"></div>
                  <div class="filter-options" role="menu"></div>
                </div>
                <div hidden>
                  <select id="source-filter" class="source-filter" data-i18n-aria="sourceFilter" aria-label="Filter by source"></select>
                  <select id="harness-filter" class="harness-filter" data-i18n-aria="harnessFilter" aria-label="Filter by harness"></select>
                  <select id="model-filter" class="model-filter" data-i18n-aria="modelFilter" aria-label="Filter by model"></select>
                  <select id="thinking-filter" class="thinking-filter" data-i18n-aria="thinkingFilter" aria-label="Filter by thinking level"></select>
                </div>
              </div>
              <div class="view-tabs" role="tablist" data-i18n-aria="resultView" aria-label="Results view">
                <button id="table-tab" type="button" role="tab" aria-controls="table-panel" aria-selected="true" data-view="table" data-i18n="tableView">Table</button>
                <button id="pareto-tab" type="button" role="tab" aria-controls="pareto" aria-selected="false" tabindex="-1" data-view="pareto" data-i18n="paretoView">Pareto</button>
              </div>
            </div>
            <span class="result-count sr-only" aria-live="polite">Loading…</span>
            <div id="table-panel" role="tabpanel" aria-labelledby="table-tab">
              <span class="table-hint" hidden data-i18n="tableHint">Scroll horizontally to view all columns →</span>
              <div class="table-wrap">
                <table>
                  <caption class="sr-only table-caption">Public Terminal-Bench results</caption>
                  <thead class="results-head"></thead>
                  <tbody class="results-body">
                    <tr><td class="loading-cell" colspan="8" data-i18n="loadingResults">Loading public results…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div id="pareto" role="tabpanel" aria-labelledby="pareto-tab" hidden>
              <div class="pareto-panel">
                <header class="pareto-heading">
                  <h2 id="pareto-title">Pareto Frontier</h2>
                </header>
                <div class="pareto-plot-shell">
                  <div class="pareto-chart"><div class="pareto-canvas"></div><div class="pareto-tooltip" hidden aria-hidden="true"></div></div>
                </div>
                <div class="pareto-readout sr-only" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <div class="section-shell footer-inner">
        <span>© 2026 Prism Shadow</span>
        <a href="https://github.com/Prism-Shadow/penguin-harness-leaderboard">GitHub</a>
      </div>
    </footer>

    <dialog class="result-dialog" aria-labelledby="result-dialog-title">
      <div class="dialog-shell">
        <header class="dialog-header">
          <div>
            <p class="eyebrow" data-i18n="resultDetails">Result details</p>
            <h2 id="result-dialog-title">Result details</h2>
            <p class="dialog-subtitle"></p>
          </div>
          <button class="dialog-close" type="button" data-i18n-aria="closeDetails" aria-label="Close details">×</button>
        </header>
        <div class="dialog-body"></div>
        <footer class="dialog-footer">
          <a class="button button-primary official-detail-link" href="https://hub.harborframework.com" target="_blank" rel="noreferrer">
            <span class="official-detail-link-label" data-i18n="openOfficialDetail">Open official detail</span>
            <span aria-hidden="true">↗</span>
          </a>
          <button class="button button-secondary dialog-done" type="button" data-i18n="done">Done</button>
        </footer>
      </div>
    </dialog>
  </body>
</html>
